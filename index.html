<title>Moi — القائمة</title>

<meta name="theme-color" content="#121110">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{--bg:#121110;--card:#1b1917;--line:#2e2a25;--gold:#c9a96a;--cream:#f3ead8;--mute:#a79d8b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--cream);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{min-height:46svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.5rem 1.5rem 2rem;
 background:radial-gradient(ellipse at 50% 20%,#2a2319 0,var(--bg) 72%)}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;letter-spacing:.08em;font-style:italic;direction:ltr;
 font-size:clamp(4rem,20vw,7rem);line-height:1;background:linear-gradient(180deg,#f0dcae,#b8944f);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo.sm{font-size:1.8rem}
.eyebrow{color:var(--gold);letter-spacing:.1em;font-size:.9rem;margin-bottom:.8rem}
.tagline{color:var(--mute);margin:1rem 0 1.4rem;max-width:30ch;font-size:.95rem}
.cta{border:1px solid var(--gold);color:var(--gold);padding:.65rem 1.8rem;border-radius:99px;text-decoration:none;font-weight:500;transition:.25s}
.cta:hover,.cta:focus-visible{background:var(--gold);color:var(--bg)}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(18,17,16,.96);backdrop-filter:blur(8px);padding:.7rem 1rem .5rem;border-bottom:1px solid var(--line)}
.search input{width:100%;max-width:640px;display:block;margin:0 auto .6rem;padding:.75rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--cream);font:inherit;font-size:1rem}
.search input:focus{outline:2px solid var(--gold);outline-offset:1px}
.cats{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.3rem;max-width:1100px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:.5rem 1rem;border-radius:99px;font:inherit;font-size:.95rem;cursor:pointer;min-height:44px;transition:.2s}
.chip:hover{color:var(--cream);border-color:var(--gold)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#17130c;font-weight:700}
.count{max-width:1100px;margin:1rem auto 0;padding:0 1.2rem;color:var(--mute);font-size:.85rem}
.grid{max-width:1100px;margin:0 auto;padding:0 1.2rem 3rem}
.sec{padding-top:1.6rem;animation:rise .35s both}
.sec h2{font-size:1.35rem;color:var(--gold);font-weight:700;padding-bottom:.5rem;border-bottom:1px solid var(--gold)}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:2.5rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.8rem 0;border-bottom:1px solid var(--line);min-height:56px}
.info{min-width:0}
.nm{font-weight:500;font-size:1.05rem}
.ds{color:var(--mute);font-size:.85rem}
.dots{flex:1;min-width:1rem;border-top:2px dotted #4a4338;align-self:center;margin-top:.2rem}
.pr{color:var(--gold);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.meal{display:inline-block;margin-top:.15rem;border:1px solid #5a4a2c;color:var(--gold);font-size:.75rem;padding:0 .6rem;border-radius:99px}
.badge{margin-inline-start:.5rem;background:var(--gold);color:#17130c;font-size:.7rem;font-weight:700;padding:.1rem .6rem;border-radius:99px;vertical-align:middle}
.rv{display:block;color:#ff8a80;font-size:.72rem}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.empty{text-align:center;color:var(--mute);padding:3rem 1rem}
footer{text-align:center;padding:2.5rem 1rem;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
</style>
</head>

</main>
<footer><span class="logo sm">Moi</span><p id="foot"></p></footer>

(function () {
  const { brand, categories, items } = window.MENU;
  const $ = (id) => document.getElementById(id);
  const showReview = new URLSearchParams(location.search).has("never-in-demo");
  let cat = "all", query = "";

  $("place").textContent = brand.place;
  $("tagline").textContent = brand.tagline;
  $("foot").textContent = brand.name + " — " + brand.place + " · الأسعار بالدينار العراقي";

  // توحيد الحروف العربية ليكون البحث متسامحًا (أ/إ/آ=ا، ى=ي، ة=ه، إزالة التشكيل)
  const norm = (s) => s.toLowerCase().replace(/[\u064B-\u065F\u0640]/g, "")
    .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/گ/g, "ك").trim();
  const fmt = (n) => n.toLocaleString("en-US");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function renderCats() {
    const nav = $("cats");
    nav.textContent = "";
    [{ id: "all", name: "الكل" }, ...categories].forEach((c) => {
      const b = el("button", "chip", c.name);
      b.type = "button";
      b.setAttribute("aria-pressed", String(c.id === cat));
      b.onclick = () => {
        cat = c.id; renderCats(); renderItems();
        const top = $("menu").offsetTop; if (window.scrollY > top) window.scrollTo({ top });
        const on = nav.querySelector("[aria-pressed=true]"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
      };
      nav.appendChild(b);
    });
  }

  function row(it) {
    const r = el("div", "row");
    const info = el("div", "info");
    const t = el("div", "nm", it.name);
    if (it.badge) t.appendChild(el("span", "badge", it.badge));
    info.appendChild(t);
    if (it.desc) info.appendChild(el("div", "ds", it.desc));
    if (it.meal) info.appendChild(el("span", "meal", "كوجبة " + fmt(it.meal)));
    if (showReview && it.review) info.appendChild(el("span", "rv", "⚠ " + it.review));
    if (it.image) {
      const img = new Image(); img.loading = "lazy"; img.alt = it.name; img.src = it.image; img.className = "th";
      img.onerror = () => img.remove();
      r.appendChild(img);
    }
    r.append(info, el("span", "dots"), el("span", "pr", fmt(it.price)));
    return r;
  }

  function renderItems() {
    const q = norm(query);
    const g = $("grid");
    g.textContent = "";
    let n = 0;
    categories.forEach((c) => {
      if (cat !== "all" && c.id !== cat) return;
      const list = items.filter((it) => it.cat === c.id && (!q || norm(it.name).includes(q)));
      if (!list.length) return;
      n += list.length;
      const s = el("section", "sec");
      s.appendChild(el("h2", "", c.name));
      const rows = el("div", "rows");
      list.forEach((it) => rows.appendChild(row(it)));
      s.appendChild(rows);
      g.appendChild(s);
    });
    $("count").textContent = "عدد الأصناف المعروضة: " + n;
    $("empty").hidden = n > 0;
  }

  $("q").addEventListener("input", (e) => { query = e.target.value; renderItems(); });
  renderCats();
  renderItems();
})();
</script>
</body>
</html>
